<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>12matt3r // The Festival</title>
  <style>
    :root{
      --cyan:#00F3FF; --magenta:#FF0055; --green:#39FF14; --ink:#e6e6f0; --muted:#8a8a99;
      --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
      --sans: "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#05050e;overflow:hidden;color:var(--ink);font-family:var(--sans);overscroll-behavior:none}
    canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:grab}
    canvas.drag{cursor:grabbing}
    .scan{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.28;mix-blend-mode:overlay;
      background:repeating-linear-gradient(0deg,rgba(255,255,255,.05),rgba(255,255,255,.05) 1px,transparent 1px,transparent 3px)}
    .vig{position:fixed;inset:0;pointer-events:none;z-index:5;
      background:radial-gradient(120% 95% at 50% 60%,transparent 55%,rgba(0,0,0,.6) 100%)}
    body.rm .scan{opacity:.14}

    .hud{position:fixed;z-index:10;font-family:var(--mono);letter-spacing:.04em}
    .top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:15px 18px;pointer-events:none}
    .brand b{font-size:15px;letter-spacing:.14em;text-shadow:1px 0 rgba(255,0,85,.5),-1px 0 rgba(0,243,255,.5)}
    .brand span{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.3em;margin-top:3px}

    /* floating name tags */
    .tags .tag{position:absolute;top:0;left:0;pointer-events:none;text-align:center;white-space:nowrap;
      font-family:var(--mono);transition:opacity .2s linear;filter:drop-shadow(0 0 8px color-mix(in srgb, var(--c) 60%, transparent))}
    .tags .tag b{display:block;font-size:12px;letter-spacing:.14em;color:#fff}
    .tags .tag span{display:block;font-size:9px;letter-spacing:.12em;color:var(--c);margin-top:1px;text-transform:uppercase}
    .tags .tag::after{content:"";display:block;width:1px;height:14px;margin:4px auto 0;background:linear-gradient(var(--c),transparent)}
    .tags .tag.close b{font-size:13px}

    .prompt{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:9;font-family:var(--mono);
      font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(230,230,240,.7);opacity:0;transition:opacity .25s;
      pointer-events:none;text-shadow:0 0 10px rgba(0,243,255,.5)}
    .prompt.on{opacity:1}

    .help{position:fixed;left:16px;bottom:14px;z-index:10;font-family:var(--mono);font-size:10.5px;color:var(--muted);
      background:rgba(8,8,18,.5);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:7px 11px;backdrop-filter:blur(6px);line-height:1.6}
    .help kbd{color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:0 5px;font-size:10px}
    .rmbtn{position:fixed;right:16px;bottom:14px;z-index:10;font-family:var(--mono);font-size:11px;color:var(--ink);
      background:rgba(10,10,20,.7);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:8px 11px;cursor:pointer;backdrop-filter:blur(6px)}
    .rmbtn:hover{border-color:var(--cyan)}

    /* destination panel */
    .panel{position:fixed;z-index:11;left:50%;bottom:22px;transform:translate(-50%,14px);
      width:min(560px,calc(100vw - 28px));background:linear-gradient(180deg,rgba(10,10,20,.85),rgba(6,6,14,.93));
      border:1px solid var(--c,rgba(0,243,255,.4));border-radius:15px;padding:18px 20px;backdrop-filter:blur(12px);
      box-shadow:0 0 40px -10px var(--c,rgba(0,243,255,.4));opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
    .panel.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
    body.rm .panel{transition:opacity .01s}
    .panel .role{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--c,var(--cyan))}
    .panel h2{font-family:var(--mono);font-size:23px;letter-spacing:.02em;margin:5px 0 6px;text-shadow:1.5px 0 rgba(255,0,85,.4),-1.5px 0 rgba(0,243,255,.4)}
    .panel p{color:#c7c7d4;font-size:14px;line-height:1.6;max-width:52ch}
    .panel .row{display:flex;gap:10px;align-items:center;margin-top:14px}
    .panel .cta{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:#05050e;font-weight:700;background:var(--c,var(--cyan));
      border:none;border-radius:9px;padding:10px 16px;cursor:pointer}
    .panel .close{position:absolute;top:11px;right:13px;width:26px;height:26px;border-radius:7px;background:transparent;
      border:1px solid rgba(255,255,255,.14);color:var(--muted);cursor:pointer;font-family:var(--mono)}
    .panel .close:hover{color:var(--ink);border-color:var(--c,var(--cyan))}

    /* start overlay */
    .start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
      text-align:center;padding:24px;background:radial-gradient(70% 60% at 50% 45%,rgba(14,10,34,.5),rgba(4,4,10,.96));transition:opacity .8s}
    .start.gone{opacity:0;pointer-events:none}
    .start .g{font-family:var(--mono);font-size:clamp(28px,7vw,60px);letter-spacing:.08em;text-shadow:3px 0 var(--magenta),-3px 0 var(--cyan)}
    .start .s{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--muted);max-width:46ch;line-height:1.8}
    .start .enter{font-family:var(--mono);font-size:14px;letter-spacing:.18em;color:#05050e;font-weight:700;background:var(--cyan);
      border:none;border-radius:11px;padding:14px 32px;cursor:pointer;box-shadow:0 0 34px -4px var(--cyan)}
    .start .enter:hover{background:#fff}
    .start .foot{font-family:var(--mono);font-size:10px;color:#55555f;letter-spacing:.16em}
    :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    @media (max-width:560px){ .help{display:none} }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vig"></div>
  <div class="scan"></div>

  <div class="hud top">
    <div class="brand"><b>12MATT3R</b><span>THE FESTIVAL</span></div>
  </div>
  <div class="hud tags" id="tags"></div>
  <div class="prompt" id="prompt"></div>

  <div class="help">
    <kbd>W A S D</kbd> walk · <kbd>drag</kbd> look · <b>click a name</b> to walk to them
  </div>
  <button class="rmbtn" id="rmbtn" title="Reduced motion">◐ motion</button>

  <div class="panel" id="panel" role="dialog" aria-labelledby="pTitle">
    <button class="close" id="pClose" aria-label="Back">✕</button>
    <div class="role" id="pRole">—</div>
    <h2 id="pTitle">—</h2>
    <p id="pBody">—</p>
    <div class="row"><button class="cta" id="pCta">Enter</button></div>
  </div>

  <div class="start" id="start">
    <div class="g">ＴＨＥ ＦＥＳＴＩＶＡＬ</div>
    <div class="s">you spawn on a bench at the edge of the crowd, staring at the stage. walk through the crowd and reach an artist to open their world.</div>
    <button class="enter" id="enterBtn">▶ ENTER THE CROWD</button>
    <div class="foot">12matt3r experience · three.js prototype</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
