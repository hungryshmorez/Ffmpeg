name: ffworks
on:
  push:
    paths: ["ffworks/**", ".github/workflows/ffworks.yml"]
  pull_request:
    paths: ["ffworks/**", ".github/workflows/ffworks.yml"]
defaults:
  run:
    working-directory: ffworks
jobs:
  engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ffworks }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: cargo test --workspace
      - run: npm test --prefix ui
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ffworks }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: choco install ffmpeg -y --no-progress
      - name: Fetch FFmpeg (full build, with plugin support) to bundle with the installer
        shell: pwsh
        run: |
          $base = "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1"
          Invoke-WebRequest "$base/ffmpeg-7.1.1-full_build.zip" -OutFile ffmpeg.zip
          $got = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          "ffmpeg full_build sha256: $got" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # The GitHub release carries no checksum file; this hash was read from a reviewed CI run (2026-10-02) and pinned.
          $pinned = "d760e1b3574402ed18b4865851f87d87e73965a982e6453212df8621fed1c508"
          if ($pinned -ne "" -and $got -ne $pinned) { throw "FFmpeg download checksum mismatch: $got" }
          if ($pinned -eq "") { Write-Warning "FFmpeg full build is not checksum-pinned yet" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $root = Get-ChildItem ffmpeg-extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force src-tauri/ffmpeg-bin | Out-Null
          Copy-Item "$($root.FullName)/bin/ffmpeg.exe","$($root.FullName)/bin/ffprobe.exe","$($root.FullName)/LICENSE","$($root.FullName)/README.txt" src-tauri/ffmpeg-bin/
          Copy-Item THIRD_PARTY_NOTICES.md src-tauri/ffmpeg-bin/
          $ff = "$($root.FullName)/bin/ffmpeg.exe"
          $caps = @()
          $caps += "## Bundled FFmpeg capabilities"
          $filters = & $ff -hide_banner -filters 2>&1 | Out-String
          foreach ($f in "frei0r","ladspa","lv2","libplacebo","zscale","xfade") {
            $caps += ("- {0}: {1}" -f $f, ($filters -match "\b$f\b"))
          }
          $caps | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Write-Host ("::notice title=bundled FFmpeg::" + ($caps -join " ") + " sha256=" + $got)
          if ($filters -notmatch "\bfrei0r\b") { Write-Warning "bundled FFmpeg has no frei0r filter" }
      - name: Fetch frei0r plugins (Win64) to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/frei0r-bin | Out-Null
          try {
            # pinned release (read from a reviewed CI run); bump both lines together
            $rel = @{ tag_name = "v3.6.0" }
            $asset = @{ name = "frei0r-3.6.0_win64.zip"; browser_download_url = "https://github.com/dyne/frei0r/releases/download/v3.6.0/frei0r-3.6.0_win64.zip" }
            Invoke-WebRequest $asset.browser_download_url -OutFile frei0r.zip
            $fsha = (Get-FileHash frei0r.zip -Algorithm SHA256).Hash.ToLower()
            "frei0r $($rel.tag_name) $($asset.name) sha256: $fsha"
            if ($fsha -ne "f1f3fdea0b98f855df35c67d3a62d03cf41ea549ceb4aaa9ce7b21b8dfd15728") { throw "frei0r download checksum mismatch: $fsha" }
            Expand-Archive frei0r.zip -DestinationPath frei0r-extract
            $dlls = Get-ChildItem frei0r-extract -Recurse -Filter *.dll
            $dlls | Copy-Item -Destination src-tauri/frei0r-bin/
            Get-ChildItem frei0r-extract -Recurse -Include COPYING*,LICENSE*,README* | Copy-Item -Destination src-tauri/frei0r-bin/ -ErrorAction SilentlyContinue
            Write-Host "::notice title=frei0r bundle::$($dlls.Count) dlls, release $($rel.tag_name), asset $($asset.name)"
            "frei0r plugins bundled: $($dlls.Count); glitch0r present: $([bool]($dlls | Where-Object Name -eq 'glitch0r.dll'))" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } catch {
            # a wrong checksum is never shipped; a download hiccup only warns (the installer then has no plugins)
            if ("$_" -match "checksum") { throw }
            Write-Warning "frei0r plugins NOT bundled: $_"
          }
          "frei0r plugins are GPL-2.0-or-later; source: https://github.com/dyne/frei0r" | Set-Content src-tauri/frei0r-bin/NOTICE.txt
      - name: Read the bundled frei0r plugins' parameter tables (so every shipped plugin is offered)
        shell: pwsh
        run: |
          if (-not (Get-ChildItem src-tauri/frei0r-bin -Filter *.dll -ErrorAction SilentlyContinue)) { Write-Warning "no plugins to read"; exit 0 }
          Copy-Item crates/ffworks-core/assets/frei0r/plugins.json plugins.committed.json
          python scripts/frei0r/dump.py src-tauri/frei0r-bin
          $n = (Get-Content crates/ffworks-core/assets/frei0r/plugins.json -Raw | ConvertFrom-Json).plugins.Count
          if ($n -lt 100) {
            Write-Warning "only $n plugin tables could be read; keeping the committed table"
            Copy-Item plugins.committed.json crates/ffworks-core/assets/frei0r/plugins.json
          } else {
            Write-Host "::notice title=frei0r tables::$n plugin parameter tables read from the bundled DLLs"
          }
          "----- BEGIN plugins.json -----"
          Get-Content crates/ffworks-core/assets/frei0r/plugins.json -Raw
          "----- END plugins.json -----"
      - run: npm ci --prefix ui
      - run: cargo test -p ffworks-core
      - run: npx --prefix ui tauri build
      - name: Check the installer actually contains the bundled FFmpeg (size sanity)
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          "{0}: {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)
          if ($exe.Length -lt 30MB) { throw "installer is too small to contain ffmpeg.exe + ffprobe.exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: ffworks-windows-installers
          path: ffworks/target/release/bundle/**/*
