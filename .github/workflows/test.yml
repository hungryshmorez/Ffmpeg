# The test that can't lie, on every push (item #100).
#
# Runs the frames-not-bytes round trip and the golden workflow matrix in a real
# headless Chromium. Everything the app needs is in the repo (the ffmpeg.wasm
# cores under vendor/, the in-process COOP/COEP server inside the tests), so
# there is nothing to stand up — check out, install, run.
name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No lockfile in the repo, so install (not ci). Only dep is playwright.
      - name: Install deps
        run: npm install

      # Fetch the Chromium build that matches the pinned playwright. The tests
      # use process.env.PW_EXEC when set and otherwise fall back to playwright's
      # own browser resolution — which this provides.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Cheap syntax + changelog gate first (fails fast on a broken file).
      - name: Verify
        run: npm run verify

      # The round trip: a real file in, a real DECODED video out, 5/5.
      - name: Round trip (5x)
        run: npm test

      # Golden matrix: each workflow's signature actually landed in the output,
      # plus both audio branches (no-audio -> -an guard, with-audio -> mux).
      - name: Workflow matrix
        run: npm run test:workflows

      # Layer compositor: stacks two decoded clips and reads the composited
      # pixels back — blend modes, solo/mute, opacity, crossfade. Frames, not bytes.
      - name: Layer compositor
        run: npm run test:compositor

      # Keyboard shortcuts: drives the keyboard and reads back UI state — cheat
      # sheet open/close, VJ-key coverage, tab cycling, Alt+n jump.
      - name: Keyboard shortcuts
        run: npm run test:shortcuts

      # v4/v5 "new engine" workflows: drives the real card click for TRUE
      # bitstream datamosh and motion-vector datamosh, and decodes what lands in
      # the Media Bin (bloom duplicates frames; motion mosh is a real video).
      - name: New-engine workflows (v4/v5)
        run: npm run test:workflows-v4v5

      # Compress-to-target + scene split: the other addBlobToBin surfaces —
      # decode the produced clips out of the bin (real frames, under target size).
      - name: Media-bin producers
        run: npm run test:bin-features

      # Audio Studio: loadFromBin → Web Audio bounce → decode the output to PCM
      # samples (WAV direct + MP3 with two-pass loudnorm).
      - name: Audio Studio bounce
        run: npm run test:audio-studio

      # Clip Studio: add clips to the library, export the sequence, and decode
      # the concatenated result (frame count = sum of the clips).
      - name: Clip sequence export
        run: npm run test:clips

      # Mobile / iPad: touch-emulated contexts at phone + tablet sizes assert no
      # horizontal page overflow and that taps switch/reach tabs.
      - name: Mobile + iPad layout
        run: npm run test:mobile

      # VJ panic: latch triggers + sequencer + master, then PANIC (button and
      # the "0" key) must reset everything.
      - name: VJ panic
        run: npm run test:panic

      # Mosh family: directional / masking / amplification / bloom shaping of the
      # motion-vector field, verified deterministically on the field + pixels.
      - name: Mosh family
        run: npm run test:mosh-family

      # Two-clip datamosh (#62): select two clips → "Datamosh A→B" → a decodable
      # video lands in the bin (clip A's motion applied to clip B's picture).
      - name: Two-clip datamosh
        run: npm run test:datamosh2

      # Databend (#66): corrupt the raw bytes, decode through the damage — the
      # output must still decode to real frames.
      - name: Databend
        run: npm run test:databend

      # Masked / angled pixel sort (#64): band-mask leaves out-of-band pixels
      # untouched, in-band runs come back sorted, and the angle changes the frame.
      - name: Pixel sort (masked/angled)
        run: npm run test:pixelsort

      # Feedback tunnel (#67): zoom>1 spreads a central detail outward, decay
      # fades the buffer, rotate moves the trail — verified on the buffer pixels.
      - name: Feedback tunnel
        run: npm run test:feedback

      # Flow displacement (#68): the motion field warps its own frame as a
      # bilinear displacement map — a uniform field shifts an edge by dx*scale,
      # zero leaves it be, a varying field warps the halves differently.
      - name: Flow displacement
        run: npm run test:flow-displace

      # Motion-vector overlay (#57): draw the estimated field as arrows and read
      # the ink back — nothing before a field, ink after, arrows point +x,+y.
      - name: Motion-vector overlay
        run: npm run test:vector-overlay

      # Scopes (#51): vectorscope + waveform, pure ImageData math — grey centres,
      # red/blue push apart, and the luma trace rises on a dark→bright gradient.
      - name: Colour scopes
        run: npm run test:scopes

      # Halation & bloom (#48): a bright spot blooms into its black surroundings
      # with a reddish tint; a dim frame and a black frame barely change.
      - name: Halation & bloom
        run: npm run test:halation

      # Stereo width + correlation (#31): the DSP core on synthesised PCM, then
      # an end-to-end offline bounce through the real graph — width=0 → mono
      # (corr +1), width=2 wider than width=1.
      - name: Stereo width + correlation
        run: npm run test:stereo-width

      # Lookahead limiter (#29): spikes at 2.0 come back with no sample over the
      # ceiling (transient caught, not overshot); an under-ceiling signal is
      # untouched; an end-to-end bounce caps at the set dB ceiling.
      - name: Master limiter
        run: npm run test:limiter

      # Transient shaper (#39): on a drum hit, attack=+1 raises the crest factor,
      # attack=-1 lowers it, sustain=+1 lifts the tail RMS; neutral is untouched.
      - name: Transient shaper
        run: npm run test:transient

      # Sidechain duck (#27): kick detected from the sub band pumps the pad — the
      # level dips after each kick and recovers before the next; amount=0 is off.
      - name: Sidechain duck
        run: npm run test:sidechain

      # Mid/side EQ (#30): mono-the-bass collapses the low side, widen-the-highs
      # lifts the high side, neutral is untouched.
      - name: Mid/side EQ
        run: npm run test:ms-eq

      # Multiband compression (#28): complementary crossovers sum to unity; the
      # low band compresses down with a real GR read while the high band is left
      # alone.
      - name: Multiband compression
        run: npm run test:multiband

      # Film grain (#47): plate-based grain adds texture, preserves the mean, and
      # is CLUMPY (lag-1 autocorrelation ≫ white noise) — proving it's a plate.
      - name: Film grain
        run: npm run test:film-grain

      # Speed-up motion blur (#43): frameBlend smears a moving dot along its path
      # (mid-path lit, peak lowered, span widened); a still is left untouched.
      - name: Speed-up motion blur
        run: npm run test:speed-blur

      # Stem separation (#26): instrumental cancels the centre vocal, spectral
      # acapella lifts the vocal/instrument ratio; mono degrades gracefully.
      - name: Stem separation
        run: npm run test:stems
