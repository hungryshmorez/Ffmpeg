[workspace]
resolver = "2"
members = ["crates/ffworks-core", "crates/ffworks-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

# Line tables are enough for backtraces; full debug info made the debug build (wasmtime included) several GB.
[profile.dev]
debug = "line-tables-only"
