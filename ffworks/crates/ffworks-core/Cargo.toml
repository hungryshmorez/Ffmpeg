[package]
name = "ffworks-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FFWORKS engine: project model, command bus, render graph, FFmpeg compiler, jobs. No GUI dependencies."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid = { version = "1", features = ["v4"] }
scenesdetect = "0.4"
ebur128 = "0.1"
rustfft = "6"
fs4 = "0.13"
rhai = { version = "1.26.1", default-features = false, features = ["std", "no_module", "serde"] }
fasteval = "0.2"
tiny_http = "0.12"
extism = { version = "1.30", default-features = false, features = ["wasmtime-default-features"] }
rusqlite = { version = "0.40", features = ["bundled"] }
midly = "0.5"

[dev-dependencies]
tempfile = "3"
