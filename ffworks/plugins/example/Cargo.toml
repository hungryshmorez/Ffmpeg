# Example FFWORKS plugin and the fixture the plugin tests run. Not part of the app's workspace: it builds for wasm32.
# Rebuild the committed plugin.wasm with ./build.sh.
[package]
name = "ffworks-example-plugin"
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
